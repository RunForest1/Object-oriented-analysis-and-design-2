# ============================================
# Конфигурация приложения ToDo на русском языке
# ============================================

# Название приложения
spring.application.name=todo-app-russified

# Порт сервера
server.port=8080

# ============================================
# Конфигурация MySQL базы данных
# ============================================

# URL подключения к БД (контейнер MySQL)
spring.datasource.url=jdbc:mysql://mysql:3306/todo_db

# Пользователь БД
spring.datasource.username=root

# Пароль БД
spring.datasource.password=root

# Драйвер для работы с MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# Конфигурация JPA Hibernate
# ============================================

# Стратегия создания таблиц (update - обновлять существующие)
spring.jpa.hibernate.ddl-auto=update

# Показывать SQL запросы в консоли
spring.jpa.show-sql=true

# Форматировать SQL для удобного чтения
spring.jpa.properties.hibernate.format_sql=true

# Диалект MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# Логирование
# ============================================

# Основной уровень логирования
logging.level.root=INFO

# Логирование приложения (подробное)
logging.level.com.todo=DEBUG

# Логирование Spring Framework
logging.level.org.springframework.web=INFO

# Логирование базы данных
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# Дополнительные параметры
# ============================================

# Разрешить вывод стека ошибок в консоль
server.error.include-stacktrace=always

# Кодировка UTF-8 для поддержки русского языка
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
